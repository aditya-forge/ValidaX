[project]
name = "validax"
version = "1.0.0"
description = "Fraud risk triage for e-commerce transactions (IEEE-CIS): chronological XGBoost model, cost/capacity decisioning, SHAP reason codes and a Streamlit investigation console."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.67.0",
    "pandas==3.1.1",
    "numpy==2.5.5",
    "pyarrow==26.0.1",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "shap==0.54.1",
    "plotly==7.1.0",
    "matplotlib==3.11.2",
    "joblib==1.6.0",
]

[project.optional-dependencies]
analysis = ["duckdb==2.0.1", "nbformat==5.11.1", "nbconvert==7.17.2", "ipykernel==7.4.0"]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E402"]  # app/app.py adds src/ to sys.path before importing project modules

[tool.ruff.lint.isort]
known-first-party = ["data_processing", "features", "model", "scoring"]
