# ValidaX themes. Streamlit renders widgets, menus and data tables from these values;
# the header switch (or Settings > Theme) picks Light or Dark. Keep in sync with
# PALETTE in app/app.py.
[theme]
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
font = "sans-serif"

[theme.light]
primaryColor = "#1F6FEB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
linkColor = "#1F6FEB"
borderColor = "#E2E8F0"
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#F1F5F9"
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
chartCategoricalColors = ["#1F6FEB", "#15803D", "#CA8A04", "#E11D48", "#7C3AED", "#64748B"]

[theme.dark]
primaryColor = "#4C8DF6"
backgroundColor = "#202124"
secondaryBackgroundColor = "#292A2D"
textColor = "#E8EAED"
linkColor = "#4C8DF6"
borderColor = "#3C4043"
dataframeBorderColor = "#3C4043"
dataframeHeaderBackgroundColor = "#292A2D"
codeBackgroundColor = "#292A2D"
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
chartCategoricalColors = ["#4C8DF6", "#22C55E", "#EAB308", "#F43F5E", "#A78BFA", "#94A3B8"]

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"

[theme.dark.sidebar]
backgroundColor = "#202124"
secondaryBackgroundColor = "#292A2D"
textColor = "#E8EAED"
borderColor = "#3C4043"

[browser]
gatherUsageStats = false
