# ValidaX dark theme. Streamlit renders widgets, menus and data tables from these
# values, so the whole app stays dark with no light-theme fallbacks. Keep in sync
# with the design tokens at the top of app/app.py.
[theme]
base = "dark"
primaryColor = "#0EA5E9"
backgroundColor = "#0A0E17"
secondaryBackgroundColor = "#111726"
textColor = "#F8FAFC"
linkColor = "#38BDF8"
borderColor = "#1E293B"
dataframeBorderColor = "#1E293B"
dataframeHeaderBackgroundColor = "#111726"
showWidgetBorder = true
baseRadius = "4px"
buttonRadius = "4px"
font = "sans-serif"
codeBackgroundColor = "#111726"
chartCategoricalColors = ["#38BDF8", "#22C55E", "#EAB308", "#F43F5E", "#A78BFA", "#94A3B8"]

[theme.sidebar]
backgroundColor = "#0A0E17"
secondaryBackgroundColor = "#111726"
textColor = "#F8FAFC"
borderColor = "#1E293B"

[browser]
gatherUsageStats = false
