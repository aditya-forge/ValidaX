# ValidaX themes. Streamlit renders widgets, menus and data tables from these values;
# the header switch (or Settings > Theme) picks Light or Dark. Keep in sync with
# PALETTE in app/app.py.
[theme]
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
font = "sans-serif"

[theme.light]
primaryColor = "#0284C7"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
linkColor = "#0284C7"
borderColor = "#E2E8F0"
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#F1F5F9"
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
chartCategoricalColors = ["#0284C7", "#15803D", "#CA8A04", "#E11D48", "#7C3AED", "#64748B"]

[theme.dark]
primaryColor = "#38BDF8"
backgroundColor = "#0A0E17"
secondaryBackgroundColor = "#111726"
textColor = "#F8FAFC"
linkColor = "#38BDF8"
borderColor = "#1E293B"
dataframeBorderColor = "#1E293B"
dataframeHeaderBackgroundColor = "#111726"
codeBackgroundColor = "#111726"
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
chartCategoricalColors = ["#38BDF8", "#22C55E", "#EAB308", "#F43F5E", "#A78BFA", "#94A3B8"]

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"

[theme.dark.sidebar]
backgroundColor = "#0A0E17"
secondaryBackgroundColor = "#111726"
textColor = "#F8FAFC"
borderColor = "#1E293B"

[browser]
gatherUsageStats = false
