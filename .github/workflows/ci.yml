name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt pytest==9.2.0 ruff==0.17.6

      - name: Lint
        run: python -m ruff check src app tests

      - name: Unit and smoke tests
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t validax-console .

      - name: Start container and wait for health
        run: |
          docker run -d --name validax --read-only --tmpfs /tmp -p 8501:8501 validax-console
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8501/_stcore/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs validax
          exit 1
